name: check links

# Tracker task 13: external repos get renamed and moved. This checks every link in the
# Markdown files each Monday and opens an issue if any are broken.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path sample-repo "./**/*.md"
          fail: false
      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Broken links found" --body-file ./lychee/out.md
